name: Instagram Weekly Post Data

on:
  schedule:
    - cron: "0 10 * * 2"     # Di 10:00 UTC = 12:00 MESZ (Winter: 11:00 MEZ)
  workflow_dispatch:
    inputs:
      week:
        description: "Week (0 = letzte abgeschlossene)"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEEK: ${{ github.event.inputs.week }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - name: Build week JSON
        run: |
          if [ -n "$WEEK" ] && [ "$WEEK" != "0" ]; then
            python instagram/build_week.py --week "$WEEK"
          else
            python instagram/build_week.py
          fi
      - name: Render slides (PNG 2x)
        run: |
          if [ -n "$WEEK" ] && [ "$WEEK" != "0" ]; then
            python instagram/render_post.py --week "$WEEK"
          else
            python instagram/render_post.py
          fi
      - name: Commit & push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add instagram/data/ instagram/export/
          git commit -m "instagram: week data update" || echo "No changes to commit"
          git push
