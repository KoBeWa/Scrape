name: Instagram Weekly Post Data

on:
  schedule:
    - cron: "0 10 * * 2"     # Di 10:00 UTC = 12:00 MESZ (Winter: 11:00 MEZ)
  workflow_dispatch:
    inputs:
      week:
        description: "Week (leer = letzte abgeschlossene)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build week JSON
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python instagram/build_week.py --week ${{ inputs.week }}
          else
            python instagram/build_week.py
          fi
      - name: Commit & push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/data/
          git commit -m "instagram: week data update" || echo "No changes to commit"
          git push
