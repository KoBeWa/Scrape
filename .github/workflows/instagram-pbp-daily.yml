name: Instagram PBP Daily

on:
  schedule:
    - cron: "0 6 * * *"      # täglich 06:00 UTC = 08:00 MESZ (Winter: 07:00 MEZ)
  workflow_dispatch:
    inputs:
      season:
        description: "Season (0 = aktuelle)"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  pbp:
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ github.event.inputs.season }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch & slim PBP
        run: |
          if [ -n "$SEASON" ] && [ "$SEASON" != "0" ]; then
            python instagram/fetch_pbp.py --season "$SEASON"
          else
            python instagram/fetch_pbp.py
          fi
      - name: Commit & push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/pbp/
          git pull --rebase --autostash
          git commit -m "instagram: pbp daily update" || echo "No changes to commit"
          git push
