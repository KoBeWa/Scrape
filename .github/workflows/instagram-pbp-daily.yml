name: Instagram PBP Daily

on:
  schedule:
    - cron: "0 6 * * *"      # täglich 06:00 UTC = 08:00 MESZ (Winter: 07:00 MEZ)
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leer = aktuelle)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  pbp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch & slim PBP
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python instagram/fetch_pbp.py --season ${{ inputs.season }}
          else
            python instagram/fetch_pbp.py
          fi
      - name: Commit & push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/pbp/
          git commit -m "instagram: pbp daily update" || echo "No changes to commit"
          git push
