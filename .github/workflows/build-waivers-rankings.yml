name: Build Waiver Rankings

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "output/PlayerRanks_with_vorp_draftpick.csv"
      - "output/teamgamecenter_all_2015_2025_w1_16.csv"
      - "scripts/build_waivers_rankings.py"
      - ".github/workflows/build-waivers-rankings.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run waiver rankings build
        run: |
          python scripts/build_waivers_rankings.py

      - name: Commit & push outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add public/data/league/waivers.tsv public/data/league/waivers_owner_yearly.tsv || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update waiver rankings ($(date -u +'%Y-%m-%dT%H:%MZ'))"
          git push
