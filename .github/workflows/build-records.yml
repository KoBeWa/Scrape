name: Build Records

on:
  workflow_dispatch:
  push:
    paths:
      - "output/teamgamecenter/**.csv"
      - "scripts/build_records.py"
      - "config/league_records.yml"

permissions:
  contents: write

concurrency:
  group: build-records
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Build records
        run: |
          python scripts/build_records.py

      - name: Commit outputs (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add output/records/*

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update records ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git push
          fi
