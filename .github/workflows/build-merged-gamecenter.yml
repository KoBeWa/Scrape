name: Build merged teamgamecenter

on:
  workflow_dispatch:
  push:
    paths:
      - "output/teamgamecenter/**.csv"
      - "scripts/merge_teamgamecenter_strict.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas

      - run: python scripts/merge_teamgamecenter_strict.py

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add output/teamgamecenter_all_2015_2025_w1_16.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update merged teamgamecenter"
            git push
          fi
