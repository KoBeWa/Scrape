name: Draft Stats (Grade4)

on:
  workflow_dispatch:
  push:
    paths:
      - "output/PlayerRanks_with_vorp_draftpick.csv"
      - "scripts/draft_stats.py"
      - ".github/workflows/draft-stats.yml"
  schedule:
    - cron: "13 3 * * 1" # Mondays 03:13 UTC

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Generate draft stats
        run: |
          python scripts/draft_stats.py \
            --input output/PlayerRanks_with_vorp_draftpick.csv \
            --outdir output/draft_stats \
            --min-year 2015 \
            --max-year 2024

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/draft_stats/REPORT.md output/draft_stats/REPORT.json output/draft_stats/seasons/*.json
          git diff --cached --quiet || git commit -m "Update draft stats report (Grade4)"
          git push
